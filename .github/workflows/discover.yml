name: Find new free books (weekly)

on:
  schedule:
    - cron: "0 4 * * 1"   # Monday 10:00 Bangladesh time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Find new books
        run: node scripts/discover.mjs
      - name: Save changes
        run: |
          git config user.name "freelearn-bot"
          git config user.email "noreply@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Discover $(date -u +%F): add new books"
            git pull --rebase
            git push
          fi
