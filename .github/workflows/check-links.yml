name: Check links (daily)

on:
  schedule:
    - cron: "20 3 * * *"   # 09:20 Bangladesh time, every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check every link
        run: node scripts/check-links.mjs
      - name: Save changes
        run: |
          git config user.name "freelearn-bot"
          git config user.email "noreply@github.com"
          git add data.json links-status.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Link check $(date -u +%F): update data"
            git pull --rebase
            git push
          fi
          
